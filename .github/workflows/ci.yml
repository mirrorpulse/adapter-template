name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build-and-test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Verify the locked sample build
        run: pwsh ./eng/verify.ps1
      - name: Verify release inputs and dual-RID signing
        run: pwsh ./eng/verify-release.ps1
      - name: Build a fresh template and run its signed Worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh ./eng/verify-generated-template.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: template-conformance-${{ matrix.runner }}
          path: artifacts/generated/**/artifacts/template-conformance.json
          if-no-files-found: error
